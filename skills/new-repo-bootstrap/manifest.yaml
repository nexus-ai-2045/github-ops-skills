# new-repo-bootstrap
# SSOT in this repository: skills/new-repo-bootstrap/
name: new-repo-bootstrap
owner_kind: skill
ssot_pointers:
  - skills/new-repo-bootstrap/SKILL.md
  - skills/new-repo-bootstrap/scripts/bootstrap_repo.py
  - scripts/bootstrap_repo.py
runtimes:
  claude:
    mode: copy
    files:
      - SKILL.md
      - scripts/bootstrap_repo.py
  codex:
    mode: copy
    files:
      - SKILL.md
      - scripts/bootstrap_repo.py
  grok:
    mode: copy
    files:
      - SKILL.md
      - scripts/bootstrap_repo.py
duplication_guard:
  enabled: true
  max_overlap_lines: 2
interface:
  display_name: "New Repo Bootstrap"
  short_description: "repo-preflight から委任された新規リポジトリ作成を実行する。"
  default_prompt: "Use $new-repo-bootstrap as the execution backend of repo-preflight --create-repo for repository creation and resumption."
