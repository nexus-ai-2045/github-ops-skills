name: public-repo-readiness
owner_kind: skill
ssot_pointers:
  - skills/public-repo-readiness/SKILL.md
  - scripts/public_identity_guard.py
  - PUBLIC_READY.md
  - SECURITY.md
  - LICENSE
runtimes:
  claude:
    mode: copy
    files: [SKILL.md]
  codex:
    mode: copy
    files: [SKILL.md]
  grok:
    mode: copy
    files: [SKILL.md]
duplication_guard:
  enabled: true
  max_overlap_lines: 2
interface:
  display_name: "Public Repo Readiness"
  short_description: "公開 repo の lockdown と PUBLIC_READY 整備を fail-closed で進める。"
  default_prompt: "Use $public-repo-readiness when preparing a repository for public readiness review."
