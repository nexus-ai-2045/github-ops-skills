name: Core Suite CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存関係を導入
        run: python -m pip install -e ".[dev]"
      - name: 全テストを実行
        run: python -m pytest -q

  contracts:
    name: 静的契約とadapter検証
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存関係を導入
        run: python -m pip install -e ".[dev]"
      - name: Python構文を確認
        run: python -m compileall -q src scripts tests
      - name: 差分形式を確認
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            git diff --check "$BEFORE_SHA"..HEAD
          else
            git diff --check "$BASE_SHA"..HEAD
          fi
      - name: Codex adapterを検証
        run: python adapters/codex/verify_adapter.py
      - name: source manifest target hashを検証
        run: python scripts/verify_source_manifest_targets.py
      - name: review invariant registryを検証
        run: python scripts/verify_invariant_registry.py
      - name: Claude adapterを検証
        run: python adapters/claude/verify_adapter.py
