name: Core Suite CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存関係を導入
        run: python -m pip install -e ".[dev]"
      - name: 全テストを実行
        run: python -m pytest -q

  contracts:
    name: 静的契約とadapter検証
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存関係を導入
        run: python -m pip install -e ".[dev]"
      - name: Python構文を確認
        run: python -m compileall -q src scripts tests
      - name: 差分形式を確認
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            git diff --check "$BEFORE_SHA"..HEAD
          else
            git diff --check "$BASE_SHA"..HEAD
          fi
      # docs/pr-self-review.md と skill 内 references/pr-self-review.md は
      # pr-review-rule-exporter (scripts/export_pr_self_review.py) が生成した配布物。
      # 配布物側は生成元を中立識別子で書いているので、ここでも正本 repository 名を書かない。
      # 候補側では生成元が宣言する
      # rules_version と配布コピーを確認し、信頼済みbase側のworkflowでは前置き部分を
      # 含む文書全体をbaseの実体と比較する。
      - name: PRセルフレビュー配布物の同一性を確認
        run: python scripts/check_pr_self_review.py --candidate-root .
      - name: Codex adapterを検証
        run: python adapters/codex/verify_adapter.py
      - name: Claude adapterを検証
        run: python adapters/claude/verify_adapter.py
