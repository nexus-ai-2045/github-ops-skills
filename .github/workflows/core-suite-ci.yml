name: Core Suite CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存関係を導入
        run: python -m pip install -e ".[dev]"
      - name: 全テストを実行
        run: python -m pytest -q

  contracts:
    name: 静的契約とadapter検証
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pythonを準備
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存関係を導入
        run: python -m pip install -e ".[dev]"
      - name: Python構文を確認
        run: python -m compileall -q src scripts tests
      - name: 差分形式を確認
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            git diff --check "$BEFORE_SHA"..HEAD
          else
            git diff --check "$BASE_SHA"..HEAD
          fi
      # docs/pr-self-review.md は nexus_ai 側の
      # scripts/export_pr_self_review.py が生成した配布物。rules_version は
      # 本文の sha256 先頭 16 桁なので、生成器を持たないこの repository でも
      # 手編集を検出できる。
      - name: PRセルフレビュー配布物の同一性を確認
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          path = pathlib.Path("docs/pr-self-review.md")
          try:
              text = path.read_text(encoding="utf-8")
          except (OSError, UnicodeError) as exc:
              sys.exit(f"{path} unreadable as UTF-8: {exc}")
          declared = re.search(r"^\| rules_version \| `([0-9a-f]{16})` \|$", text, re.M)
          if declared is None:
              sys.exit(f"{path} has no rules_version row")
          start = text.find("\n## R1 ")
          if start < 0:
              sys.exit(f"{path} has no R1 section")
          actual = hashlib.sha256(text[start + 1 :].encode("utf-8")).hexdigest()[:16]
          if actual != declared.group(1):
              sys.exit(
                  f"{path} was edited by hand: it declares rules_version "
                  f"{declared.group(1)} but its body hashes to {actual}. "
                  "Regenerate it from nexus_ai scripts/export_pr_self_review.py."
              )
          print(f"{path} matches rules_version {actual}")
          PY
      - name: Codex adapterを検証
        run: python adapters/codex/verify_adapter.py
      - name: Claude adapterを検証
        run: python adapters/claude/verify_adapter.py
