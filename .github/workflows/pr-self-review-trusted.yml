name: PRセルフレビュー（信頼済みbase）

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  integrity:
    name: 信頼済みbaseからセルフレビューを検査
    runs-on: ubuntu-latest
    steps:
      - name: 信頼済みbaseを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: 提案headを取得（実行しない）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: 信頼済みbaseの検査器で候補を検証
        working-directory: trusted-base
        run: >-
          python scripts/check_pr_self_review.py
          --base-root "$GITHUB_WORKSPACE/trusted-base"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
