name: PRセルフレビュー（base監査 advisory）

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "再検査するPR番号（base SHA更新後など）"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    name: 信頼済みbaseからセルフレビューを監査（advisory）
    runs-on: ubuntu-latest
    steps:
      - name: PRのbase/head SHAを解決
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            {
              echo "base_sha=${{ github.event.pull_request.base.sha }}"
              echo "head_sha=${{ github.event.pull_request.head.sha }}"
              echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
            } >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq \
              '"base_sha=" + .base.sha, "head_sha=" + .head.sha, "head_repo=" + .head.repo.full_name' \
              >> "$GITHUB_OUTPUT"
          fi
      - name: 信頼済みbaseを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: trusted-base
          persist-credentials: false
      - name: 提案headを取得（実行しない）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: 信頼済みbaseの検査器で候補を検証
        # このworkflowと検査器、allowlistがbaseに存在しない初回bootstrapはADVISORYにしない。
        # このrunはPR headに結び付くrequired checkではなく、人間bootstrap判断の材料である。
        working-directory: trusted-base
        run: >-
          python scripts/check_pr_self_review.py
          --base-root "$GITHUB_WORKSPACE/trusted-base"
          --candidate-root "$GITHUB_WORKSPACE/candidate"
