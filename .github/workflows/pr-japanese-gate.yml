name: PR日本語gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  metadata:
    name: PR title/body日本語検査
    runs-on: ubuntu-latest
    steps:
      - name: GitHub event metadataを検査
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              pull_request = json.load(source)["pull_request"]

          title = pull_request.get("title") or ""
          body = pull_request.get("body") or ""
          japanese = re.compile(r"[\u3040-\u30ff\u3400-\u9fff]")
          atx_headings = re.compile(
              r"^[ \t]{0,3}#{1,6}[ \t]+(.+?)\s*$", re.MULTILINE
          )
          setext_headings = re.compile(
              r"^[ \t]{0,3}(.+?)\s*\n[ \t]{0,3}(?:=+|-+)\s*$", re.MULTILINE
          )
          fence_open = re.compile(r"^\s*(`{3,}|~{3,})")
          html_comments = re.compile(r"<!--.*?-->", re.DOTALL)
          reference_definitions = re.compile(
              r"^[ \t]{0,3}\[[^\]]+\]:\s*\S+.*$", re.MULTILINE
          )
          inline_links = re.compile(r"!?\[([^\]]*)\]\([^\n)]*\)")

          def rendered_text(source):
              visible = []
              fence_char = None
              fence_length = 0
              for line in source.splitlines():
                  if fence_char:
                      if re.fullmatch(
                          rf"\s*{re.escape(fence_char)}{{{fence_length},}}\s*", line
                      ):
                          fence_char = None
                      continue
                  opening = fence_open.match(line)
                  if opening:
                      marker = opening.group(1)
                      fence_char, fence_length = marker[0], len(marker)
                      continue
                  visible.append(line)
              rendered = html_comments.sub("", "\n".join(visible))
              rendered = reference_definitions.sub("", rendered)
              return inline_links.sub(r"\1", rendered)

          rendered_body = rendered_text(body)
          visible_title = rendered_text(title)
          errors = []
          if not japanese.search(visible_title):
              errors.append("PR titleに日本語がありません")
          if not japanese.search(rendered_body):
              errors.append("PR bodyに日本語がありません")
          headings = atx_headings.findall(rendered_body) + setext_headings.findall(
              rendered_body
          )
          for heading in headings:
              if re.search(r"[A-Za-z]", heading) and not japanese.search(heading):
                  errors.append(f"英語だけの見出しがあります: {heading}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print("PR title/bodyの日本語境界を確認しました")
          PY
